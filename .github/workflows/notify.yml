name: garden-notify

on:
  schedule:
    - cron: '5 * * * *'
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'إرسال كل مهام اليوم الآن (للتجربة)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  notify:
    if: github.event.schedule != '0 6 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: setup
        run: |
          echo '{"type":"module"}' > package.json
          npm install firebase-admin@12 --no-audit --no-fund --no-save
      - name: send
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          FORCE: ${{ github.event.inputs.force }}
        run: node send.js

  keepalive:
    if: github.event.schedule == '0 6 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%d > heartbeat.txt
          git config user.name "garden-bot"
          git config user.email "garden-bot@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "heartbeat" || exit 0
          git push
